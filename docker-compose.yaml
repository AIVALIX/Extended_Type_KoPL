services:
  app:
    build: ./app
    ports:
      - "8003:8001"
    tty: true
    stdin_open: true
    container_name: python-primekgqa-experiment
    env_file: .env
    environment:
      PYTHONPATH: /app
      # Default to PrimeKGQA, can be overridden
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    volumes:
      - ./app:/app
      - ./data:/app/data
      - ./config:/app/config
      - ./result:/app/result
    working_dir: /app
    depends_on:
      - neo4j
      - neo4j_metaqa
      - neo4j_pcqa
      - neo4j_webqsp
      - neo4j_kqapro

  # PrimeKGQA Neo4j
  neo4j:
    image: neo4j:5.22.0-community
    container_name: neo4j_primekgqa
    restart: always
    environment:
      - NEO4J_dbms_databases_writable=true
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_heap_initial__size=3g
      - NEO4J_server_memory_heap_max__size=4g
      - NEO4J_server_memory_pagecache_size=6g
      - NEO4J_dbms_memory_transaction_total_max=3g
    volumes:
      - ./data/primekgqa:/import
      - ./volume/logs:/logs
      - ./volume/data:/data
    ports:
      - 7474:7474
      - 7687:7687

  # MetaQA Neo4j
  neo4j_metaqa:
    image: neo4j:5.22.0-community
    container_name: neo4j_metaqa
    restart: always
    environment:
      - NEO4J_dbms_databases_writable=true
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_heap_initial__size=1g
      - NEO4J_server_memory_heap_max__size=2g
      - NEO4J_server_memory_pagecache_size=2g
      - NEO4J_dbms_memory_transaction_total_max=1g
    volumes:
      - ./data/metaqa:/import
      - ./volume_metaqa/logs:/logs
      - ./volume_metaqa/data:/data
    ports:
      - 7475:7474
      - 7688:7687

  # PcQA Neo4j (Pan-cancer QA)
  neo4j_pcqa:
    image: neo4j:5.22.0-community
    container_name: neo4j_pcqa
    restart: always
    environment:
      - NEO4J_dbms_databases_writable=true
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_heap_initial__size=1g
      - NEO4J_server_memory_heap_max__size=2g
      - NEO4J_server_memory_pagecache_size=2g
      - NEO4J_dbms_memory_transaction_total_max=1g
    volumes:
      - ./data/pcqa:/import
      - ./volume_pcqa/logs:/logs
      - ./volume_pcqa/data:/data
    ports:
      - 7476:7474
      - 7689:7687

  # WebQSP Neo4j (Freebase subset - large: 1.2M nodes, 3.4M edges)
  neo4j_webqsp:
    image: neo4j:5.22.0-community
    container_name: neo4j_webqsp
    restart: always
    environment:
      - NEO4J_dbms_databases_writable=true
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_heap_initial__size=2g
      - NEO4J_server_memory_heap_max__size=4g
      - NEO4J_server_memory_pagecache_size=4g
      - NEO4J_dbms_memory_transaction_total_max=2g
      - NEO4J_server_jvm_additional=-XX:+UseG1GC
    volumes:
      - ./data/webqsp:/import
      - ./volume_webqsp/logs:/logs
      - ./volume_webqsp/data:/data
    ports:
      - 7479:7474
      - 7692:7687

  # KQA Pro Neo4j (Wikidata subset - 17K nodes, 208K edges)
  neo4j_kqapro:
    image: neo4j:5.22.0-community
    container_name: neo4j_kqapro
    restart: always
    environment:
      - NEO4J_dbms_databases_writable=true
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_heap_initial__size=1g
      - NEO4J_server_memory_heap_max__size=2g
      - NEO4J_server_memory_pagecache_size=2g
      - NEO4J_dbms_memory_transaction_total_max=1g
    volumes:
      - ./data/kqapro:/import
      - ./volume_kqapro/logs:/logs
      - ./volume_kqapro/data:/data
    ports:
      - 7480:7474
      - 7693:7687
